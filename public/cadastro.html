<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/footer.css">
  <!-- <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet"> -->
  <title>Cadastro</title>
</head>

<body>
  <header class="header">
    <a href="index.html">
      <img src="assets/ufchub-logo.png" class="logo">
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="#">Rankings</a>
      <a href="#">Simulador de Lutas</a>
      <a href="#">Estatísticas</a>
      <a href="#">Museu UFC</a>
      <a href="#">Login</a>
    </nav>
  </header>
  <section class="login-page">
    <div class="login-container">

      <h2>Cadastrar-se no <span>UFC Hub</span></h2>
      <p>Cadastre sua conta para explorar o sistema</p>

      <form>
        <input type="text" id="inp_nome" placeholder="Nome" required>
        <input type="email" id="inp_email" placeholder="E-mail" required>
        <input type="password" id="inp_senha" placeholder="Senha" required>
        <input type="password" id="inp_senha_conf" placeholder="Confirme a Senha" required>

        <button type="button" class="btn" onclick="cadastrar()">Cadastrar-se</button>
      </form>

      <p class="register">
        Já tem conta? <a href="login.html">Faça o Login</a>
      </p>

    </div>
  </section>
  <footer class="footer">
    <p>© 2026 UFC Hub | Todos direitos reservados</p>
  </footer>

</body>

</html>
<script>

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = inp_nome.value;
    var emailVar = inp_email.value;
    var senhaVar = inp_senha.value;
    var confirmacaoSenhaVar = inp_senha_conf.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      alert('Todos campos devem estar preenchidos!');
      return false;
    }

    if (senhaVar != confirmacaoSenhaVar) {
      alert("As senhas não coincidem!");
      return false;
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          alert("Cadastro realizado!");
          window.location.href = "login.html";
        } else {
          alert("Erro ao cadastrar");
        }
      })
      .catch(function (erro) {
        console.log(erro);
      });
  }
</script>
